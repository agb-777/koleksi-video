<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- CSP: sumber video bebas (https/http), tapi script hanya dari file ini + hls.min.js lokal.
     Catatan: frame-ancestors (anti-clickjacking) tidak bisa lewat meta, set di header server. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src 'none'; media-src https: http: blob: 'self'; connect-src 'self' https: http: blob:; worker-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Koleksi Video</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230a0a0b'/%3E%3Cpath d='M6 4.5v7l6-3.5z' fill='%23fafafa'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --surface: #141416;
    --surface-hover: #1a1a1d;
    --text: #fafafa;
    --text-muted: #8a8a8a;
    --border: #1c1c1e;
    --border-hover: #2d2d30;
    --radius: 8px;
    --pad: 32px;
    --gap: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    display: block;
    height: 100vh;
    height: 100dvh;
    max-width: 1600px;
    margin: 0 auto;
    padding: var(--pad);
  }

  #player {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--gap);
    min-height: 0;
  }

  #meta {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    user-select: none;
    white-space: nowrap;
  }
  #meta .num { color: var(--text); font-variant-numeric: tabular-nums; }

  #stage {
    position: relative;
    flex-shrink: 1;
    min-height: 0;
    max-width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Pesan & fallback boleh di-scroll di layar pendek */
  #stage.scroll { overflow: auto; max-height: 100%; align-items: flex-start; }

  #stage video {
    display: block;
    max-width: 100%;
    max-height: 100%;
    border: 0;
    background: #000;
    border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 24px 48px -16px rgba(0,0,0,0.9);
  }

  #controls {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    user-select: none;
    flex-wrap: wrap;
  }

  .btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 40px;
    padding: 0 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--surface); border-color: var(--border-hover); }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn svg {
    width: 14px; height: 14px; flex-shrink: 0;
    stroke: currentColor; fill: none; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
    transition: transform 0.2s ease;
  }
  #prev:hover:not(:disabled) svg { transform: translateX(-2px); }
  #next:hover:not(:disabled) svg { transform: translateX(2px); }

  /* ---------- LOADER ---------- */

  .loader {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    overflow: hidden;
    border-radius: 6px;
    background: #0e0e10;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0s linear 0.25s;
  }
  .loader.on { opacity: 1; visibility: visible; transition: opacity 0.2s ease; }
  /* Buffering di tengah pemutaran: jangan tutupi gambar */
  .loader.soft { background: rgba(10, 10, 11, 0.45); }
  .loader.soft::before { display: none; }

  /* kilau yang menyapu bingkai */
  .loader::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.05) 50%, transparent 70%);
    transform: translateX(-100%);
    animation: sweep 1.8s ease-in-out infinite;
  }

  /* equalizer */
  .loader .eq { position: relative; display: flex; align-items: center; gap: 4px; height: 28px; }
  .loader .eq span {
    width: 3px;
    height: 100%;
    border-radius: 2px;
    background: var(--text);
    transform: scaleY(0.25);
    animation: eq 1.1s ease-in-out infinite;
  }
  .loader .eq span:nth-child(2) { animation-delay: 0.15s; }
  .loader .eq span:nth-child(3) { animation-delay: 0.30s; }
  .loader .eq span:nth-child(4) { animation-delay: 0.45s; }
  .loader .eq span:nth-child(5) { animation-delay: 0.60s; }

  .loader .label {
    position: relative;
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  /* progres buffer di tepi atas */
  .loader .bar { position: absolute; top: 0; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.08); }
  .loader .bar i { display: block; height: 100%; width: 0; background: var(--text); transition: width 0.3s ease; }

  @keyframes sweep { to { transform: translateX(100%); } }
  @keyframes eq { 0%, 100% { transform: scaleY(0.25); } 50% { transform: scaleY(1); } }

  #msg { color: var(--text-muted); font-size: 14px; text-align: center; padding: 40px; }

  #fileWrap { display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; padding: 8px 0; }
  #fileWrap p { color: var(--text-muted); font-size: 13px; max-width: 320px; line-height: 1.6; }
  #fileWrap strong { color: var(--text); font-weight: 500; }
  #fileWrap label {
    position: relative;
    display: inline-flex; align-items: center; height: 40px; padding: 0 20px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  #fileWrap label:hover, #fileWrap label:focus-within { background: var(--surface-hover); border-color: var(--border-hover); }
  /* disembunyikan secara visual, tetap bisa difokus keyboard */
  #fileWrap input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  #fileWrap code {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; color: var(--text-muted);
    background: var(--surface); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border);
  }

  @media (max-width: 640px) {
    :root { --pad: 20px; --gap: 16px; }
    .btn { height: 38px; padding: 0 14px; font-size: 12px; }
    .btn svg { width: 13px; height: 13px; }
  }
  @media (max-width: 380px) {
    :root { --pad: 14px; --gap: 12px; }
    #meta { font-size: 10px; }
    .btn { height: 34px; padding: 0 10px; gap: 6px; font-size: 11px; }
    .btn svg { width: 12px; height: 12px; }
    #controls { gap: 6px; }
  }
  @media (max-height: 420px) {
    :root { --gap: 12px; }
    .btn { height: 34px; padding: 0 12px; font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<noscript>
  <div style="padding:40px;text-align:center;color:#8a8a8a;font-family:system-ui,sans-serif;font-size:14px">
    JavaScript diperlukan untuk menjalankan player ini.
  </div>
</noscript>

<main id="app">
  <div id="player">

    <div id="meta">
      <span>Koleksi</span>
      <span aria-hidden="true">·</span>
      <span><span class="num" id="count">0</span> video</span>
    </div>

    <div id="stage">
      <div id="msg" role="status">Memuat…</div>
    </div>

    <div id="controls">
      <button type="button" class="btn" id="prev" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        <span>Sebelumnya</span>
      </button>
      <button type="button" class="btn" id="next" disabled>
        <span>Selanjutnya</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

  </div>
</main>

<script>
(() => {
  'use strict';

  const LS_KEY = 'videoPlayer:index';
  const FETCH_TIMEOUT_MS = 10000;
  const AR_WIDE  = 16 / 9;
  const HLS_EXT   = /\.m3u8$/i;

  const playerEl   = document.getElementById('player');
  const stage      = document.getElementById('stage');
  const metaEl     = document.getElementById('meta');
  const controlsEl = document.getElementById('controls');
  const countEl    = document.getElementById('count');
  const prevBtn    = document.getElementById('prev');
  const nextBtn    = document.getElementById('next');

  let urls = [];
  let idx  = 0;
  let currentRatio = AR_WIDE;
  let gen = 0;          // token render; handler lama yang telat dibuang
  let hlsInst = null;
  let hlsPromise = null;

  // Volume & mute dibawa terus antar video
  let vol = 1;
  let muted = false;
  try {
    const v = parseFloat(localStorage.getItem('videoPlayer:vol'));
    if (!isNaN(v) && v >= 0 && v <= 1) vol = v;
    muted = localStorage.getItem('videoPlayer:muted') === '1';
  } catch (_) {}

  /* ---------- URL: allowlist http/https saja ---------- */

  function safeUrl(raw) {
    try {
      const u = new URL(raw, location.href);
      return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : null;
    } catch (_) { return null; }
  }

  function parse(text) {
    urls = text
      .split(/\r?\n/)
      .map(l => l.trim())
      .filter(l => l && !l.startsWith('#'))
      .map(l => {
        const s = safeUrl(l);
        if (!s) console.warn('[videoPlayer] URL dilewati (bukan http/https atau tidak valid):', l);
        return s;
      })
      .filter(Boolean);
  }

  /* ---------- Jenis URL: semua diputar langsung lewat <video> ---------- */

  function classify(href) {
    const path = new URL(href).pathname;
    return { src: href, ratio: AR_WIDE, hls: HLS_EXT.test(path) };
  }

  /* ---------- Util UI ---------- */

  function setCount(n) { countEl.textContent = String(n); }

  function clearStage() {
    while (stage.firstChild) stage.removeChild(stage.firstChild);
  }

  function releaseMedia() {
    if (hlsInst) { try { hlsInst.destroy(); } catch (_) {} hlsInst = null; }
    const v = stage.querySelector('video');
    if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
  }

  function showMessage(text) {
    releaseMedia();
    clearStage();
    stage.classList.add('scroll');
    const el = document.createElement('div');
    el.id = 'msg';
    el.setAttribute('role', 'status');
    el.textContent = text;
    stage.appendChild(el);
  }

  /* ---------- Ukuran media ---------- */

  function fitMedia(mediaEl, ratio) {
    if (!mediaEl || !ratio || !isFinite(ratio) || ratio <= 0) return;

    const gap = parseFloat(getComputedStyle(playerEl).gap) || 0;
    const availW = playerEl.clientWidth;
    const availH = playerEl.clientHeight - metaEl.offsetHeight - controlsEl.offsetHeight - 2 * gap;
    if (availW <= 0 || availH <= 0) return;

    let w = availW;
    let h = w / ratio;
    if (h > availH) { h = availH; w = h * ratio; }

    mediaEl.style.width  = Math.floor(w) + 'px';
    mediaEl.style.height = Math.floor(h) + 'px';
  }

  /* ---------- hls.js (opsional, file lokal hls.min.js) ---------- */

  function loadHls() {
    if (window.Hls) return Promise.resolve(window.Hls);
    if (!hlsPromise) {
      hlsPromise = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'hls.min.js';
        s.onload = () => window.Hls ? resolve(window.Hls) : reject(new Error('Hls tidak ditemukan'));
        s.onerror = () => { hlsPromise = null; reject(new Error('hls.min.js tidak ditemukan')); };
        document.head.appendChild(s);
      });
    }
    return hlsPromise;
  }

  /* ---------- Loader ---------- */

  function makeLoader() {
    const el = document.createElement('div');
    el.className = 'loader on';

    const eq = document.createElement('div');
    eq.className = 'eq';
    eq.setAttribute('aria-hidden', 'true');
    for (let i = 0; i < 5; i++) eq.appendChild(document.createElement('span'));

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = 'Memuat video';

    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.setAttribute('aria-hidden', 'true');
    const fill = document.createElement('i');
    bar.appendChild(fill);

    el.append(eq, label, bar);

    return {
      el,
      show(soft) { el.classList.toggle('soft', !!soft); el.classList.add('on'); },
      hide() { el.classList.remove('on'); },
      progress(p) {
        const pct = Math.max(0, Math.min(1, p));
        fill.style.width = Math.round(pct * 100) + '%';
        label.textContent = pct > 0 && pct < 1 ? `Memuat video ${Math.round(pct * 100)}%` : 'Memuat video';
      }
    };
  }

  /* ---------- Mount media ---------- */

  function mountVideo(info, originalUrl, token) {
    stage.classList.remove('scroll');
    currentRatio = info.ratio;

    const video = document.createElement('video');
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    video.preload = 'auto';
    video.setAttribute('aria-label', `Video ${idx + 1} dari ${urls.length}`);

    // Terapkan volume/mute dari video sebelumnya
    video.volume = vol;
    video.muted = muted;
    video.addEventListener('volumechange', () => {
      if (token !== gen) return;
      vol = video.volume;
      muted = video.muted;
      try {
        localStorage.setItem('videoPlayer:vol', String(vol));
        localStorage.setItem('videoPlayer:muted', muted ? '1' : '0');
      } catch (_) {}
    });

    // Sembunyikan tombol download/PiP bawaan (kosmetik, bukan proteksi sungguhan)
    video.setAttribute('controlsList', 'nodownload');
    video.disablePictureInPicture = true;
    video.addEventListener('contextmenu', (e) => e.preventDefault());

    video.addEventListener('error', () => {
      if (token !== gen || !video.isConnected) return;   // handler basi
      const code = video.error ? video.error.code : 0;
      let msg = 'Video tidak dapat dimuat.';
      if (code === 1) msg = 'Pemuatan video dibatalkan.';
      else if (code === 2) msg = 'Koneksi terputus saat memuat video.';
      else if (code === 3) msg = 'Video tidak dapat didekode.';
      else if (code === 4) msg = 'Format video tidak didukung, atau URL tidak valid.';
      showMessage(msg);
    });

    video.addEventListener('loadedmetadata', () => {
      if (token !== gen) return;
      if (video.videoWidth && video.videoHeight) {
        currentRatio = video.videoWidth / video.videoHeight;
        fitMedia(video, currentRatio);
      }
    });

    // Animasi loading: muncul saat memuat/buffering, hilang saat siap diputar
    const loader = makeLoader();
    let ready = false;
    const showLoader = () => {
      if (token !== gen) return;
      loader.show(ready);
      video.setAttribute('aria-busy', 'true');
    };
    const hideLoader = () => {
      if (token !== gen) return;
      ready = true;
      loader.hide();
      video.removeAttribute('aria-busy');
    };
    video.setAttribute('aria-busy', 'true');
    video.addEventListener('waiting', showLoader);
    video.addEventListener('loadeddata', hideLoader);
    video.addEventListener('canplay', hideLoader);
    video.addEventListener('playing', hideLoader);
    video.addEventListener('progress', () => {
      if (token !== gen) return;
      const d = video.duration;
      if (!d || !isFinite(d) || !video.buffered.length) return;
      loader.progress(video.buffered.end(video.buffered.length - 1) / d);
    });

    stage.append(video, loader.el);

    if (info.hls && !video.canPlayType('application/vnd.apple.mpegurl')) {
      // Chrome/Firefox: butuh hls.js
      loadHls().then((Hls) => {
        if (token !== gen) return;
        if (!Hls.isSupported()) return showMessage('Browser ini tidak mendukung HLS.');
        hlsInst = new Hls();
        hlsInst.on(Hls.Events.ERROR, (_, d) => {
          if (d && d.fatal && token === gen) showMessage('Stream HLS tidak dapat dimuat.');
        });
        hlsInst.loadSource(info.src);
        hlsInst.attachMedia(video);
      }).catch(() => {
        if (token === gen) showMessage('Stream .m3u8 butuh file hls.min.js di folder yang sama.');
      });
    } else {
      video.src = info.src;
    }

    requestAnimationFrame(() => fitMedia(video, currentRatio));
  }

  /* ---------- Render ---------- */

  function render() {
    const token = ++gen;
    releaseMedia();
    clearStage();

    if (!urls.length) {
      setCount(0);
      showMessage('Belum ada video dalam koleksi.');
      prevBtn.disabled = nextBtn.disabled = true;
      return;
    }

    setCount(urls.length);

    const url  = urls[idx];
    const info = classify(url);
    mountVideo(info, url, token);

    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === urls.length - 1;

    try { localStorage.setItem(LS_KEY, String(idx)); } catch (_) {}
  }

  /* ---------- Resize ---------- */

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const media = stage.querySelector('video');
      if (media) fitMedia(media, currentRatio);
    }, 80);
  });

  /* ---------- Navigasi ---------- */

  function go(delta) {
    const next = idx + delta;
    if (next < 0 || next >= urls.length) return;
    idx = next;
    render();
  }

  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));

  document.addEventListener('keydown', (e) => {
    // Jangan bajak shortcut browser (Alt+← = back, dll)
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;

    const t = e.target;
    const tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'VIDEO' ||
        (t && t.isContentEditable)) return;

    if (e.key === 'ArrowLeft')       { e.preventDefault(); go(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
  });

  /* ---------- Fallback: pilih file manual ---------- */

  function showFilePickerFallback() {
    releaseMedia();
    clearStage();
    stage.classList.add('scroll');
    setCount(0);
    prevBtn.disabled = nextBtn.disabled = true;

    const wrap = document.createElement('div');
    wrap.id = 'fileWrap';

    const p1 = document.createElement('p');
    p1.innerHTML = 'Gagal memuat <strong>urls.txt</strong>.<br>Pilih file secara manual:';

    const label = document.createElement('label');
    label.append('Pilih urls.txt');
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.txt,text/plain';
    label.appendChild(input);

    const p2 = document.createElement('p');
    p2.style.fontSize = '12px';
    p2.innerHTML = 'Atau jalankan <code>python -m http.server</code> di folder ini,<br>lalu buka <code>http://localhost:8000</code>';

    wrap.append(p1, label, p2);
    stage.appendChild(wrap);

    input.addEventListener('change', async (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      try {
        parse(await f.text());
        idx = 0;
        render();
      } catch (err) {
        console.error('[videoPlayer] Gagal membaca file:', err);
        showMessage('Gagal membaca file.');
      }
    });
  }

  /* ---------- Init ---------- */

  async function init() {
    let text;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
    try {
      const res = await fetch('urls.txt', { cache: 'no-store', signal: ctrl.signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      text = await res.text();
    } catch (err) {
      console.error('[videoPlayer] Gagal memuat urls.txt:', err);
      clearTimeout(timer);
      showFilePickerFallback();
      return;
    }
    clearTimeout(timer);

    parse(text);

    try {
      const saved = parseInt(localStorage.getItem(LS_KEY) || '0', 10);
      if (!isNaN(saved) && saved >= 0 && saved < urls.length) idx = saved;
    } catch (err) {
      console.warn('[videoPlayer] localStorage tidak tersedia:', err);
    }

    render();
  }

  init();
})();
</script>
</body>
</html>
